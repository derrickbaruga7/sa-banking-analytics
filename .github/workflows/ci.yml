name: Verify banking lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regression suite
        run: python -m unittest discover -s tests -v
      - name: Reproduce complete project
        run: python -m banking_lab demo --workspace build
      - name: Check committed findings
        run: |
          diff reports/FINDINGS.md build/report/FINDINGS.md
          diff reports/periods.csv build/report/periods.csv
          diff reports/version_os.csv build/report/version_os.csv
